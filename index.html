<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Netflix Tamil</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap');
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#000;color:#fff;display:flex}
.sidebar{width:60px;background:#000;height:100vh;position:fixed;display:flex;flex-direction:column;align-items:center;padding-top:20px;gap:25px;z-index:10}
.sidebar span{font-size:20px;opacity:0.6}
.sidebar span.active{opacity:1}
.main{margin-left:60px;width:100%}
.hero{height:70vh;background:linear-gradient(to right,#000 30%,transparent 70%),linear-gradient(to top,#000 10%,transparent 60%),url('https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=1200');background-size:cover;padding:60px;display:flex;align-items:center}
.hero h1{font-family:'Bebas Neue';font-size:70px}
.hero span{background:#e50914;padding:0 10px;font-size:40px;margin-left:10px}
.btn-play{background:#e50914;color:#fff;padding:12px 30px;border:none;border-radius:30px;font-weight:bold;cursor:pointer;margin-top:15px}
.row{padding:20px 40px}
.movies-row{display:flex;gap:12px;overflow-x:auto}
.movies-row::-webkit-scrollbar{display:none}
.card{min-width:180px;height:260px;border-radius:8px;overflow:hidden;position:relative;cursor:pointer;flex-shrink:0}
.card img{width:100%;height:100%;object-fit:cover}
.overlay{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,#000);padding:10px}
.badge{background:#e50914;position:absolute;top:5px;left:5px;font-size:10px;padding:2px 6px}
#popup{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.95);justify-content:center;align-items:center;z-index:100;padding:20px}
.netflix{color:#e50914;font-family:'Bebas Neue';font-size:40px;text-align:center;padding:10px;letter-spacing:3px}
</style>
</head>
<body>
<div class="sidebar"><span class="active">🏠</span><span>🔍</span><span>🎬</span><span>📺</span><span>❤️</span></div>
<div class="main">
<div class="netflix">NETFLIX TAMIL</div>
<div class="hero"><div><div style="color:#e50914;font-weight:bold;letter-spacing:3px">N SERIES</div><h1>LEO <span>BLOODY SWEET</span></h1><p>⭐ 8.8/10 | 20+ Tamil Movies</p><button class="btn-play" onclick="playMovie('Leo','qN3wfuPYTI4')">▶ Play Trailer</button></div></div>
<div class="row"><h3>❤️ Love Movies</h3><div id="love" class="movies-row"></div></div>
<div class="row"><h3>💥 Action Movies</h3><div id="action" class="movies-row"></div></div>
<div class="row"><h3>😱 Thriller Movies</h3><div id="thriller" class="movies-row"></div></div>
</div>
<div id="popup"></div>
<script>
let movies=[
{title:"96",actor:"Vijay Sethupathi",genre:"Love",trailer:"r0aQMqN6a64",img:"https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?w=400"},
{title:"Love Today",actor:"Pradeep",genre:"Love",trailer:"FvOpPeKSBt8",img:"https://images.unsplash.com/photo-1529634597503-139d3726fed5?w=400"},
{title:"OK Kanmani",actor:"Dulquer",genre:"Love",trailer:"2vV1y9cX7pY",img:"https://images.unsplash.com/photo-1529634597503-139d3726fed5?w=400"},
{title:"Leo",actor:"Vijay",genre:"Action",trailer:"qN3wfuPYTI4",img:"https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=400"},
{title:"Jailer",actor:"Rajini",genre:"Action",trailer:"xT5_hR6v15Q",img:"https://images.unsplash.com/photo-1485846234645-a62644f84728?w=400"},
{title:"Vikram",actor:"Kamal",genre:"Action",trailer:"OKBMCL-frPU",img:"https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=400"},
{title:"Master",actor:"Vijay",genre:"Action",trailer:"UTiXQcrLlv4",img:"https://images.unsplash.com/photo-1574267432553-4b4628081c31?w=400"},
{title:"Kaithi",actor:"Karthi",genre:"Action",trailer:"2O1s95I5G8g",img:"https://images.unsplash.com/photo-1594909122845-11baa439b7bf?w=400"},
{title:"Ratsasan",actor:"Vishnu",genre:"Thriller",trailer:"G0a1b2c3d4E",img:"https://images.unsplash.com/photo-1533928298208-27ff66555d8d?w=400"},
{title:"Vada Chennai",actor:"Dhanush",genre:"Thriller",trailer:"q5GG5HJ1hVk",img:"https://images.unsplash.com/photo-1509347528160-9a9e33742cdb?w=400"},
{title:"D16",actor:"Rahman",genre:"Thriller",trailer:"9z8x7c6v5b4",img:"https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=400"},
{title:"Vikram Vedha",actor:"VJS",genre:"Thriller",trailer:"1s9a2d3f4g5",img:"https://images.unsplash.com/photo-1522869635100-9f4c5e86aa37?w=400"}
];
function render(){
document.getElementById('love').innerHTML=movies.filter(m=>m.genre=='Love').map(m=>card(m)).join('');
document.getElementById('action').innerHTML=movies.filter(m=>m.genre=='Action').map(m=>card(m)).join('');
document.getElementById('thriller').innerHTML=movies.filter(m=>m.genre=='Thriller').map(m=>card(m)).join('');
}
function card(m){return `<div class="card" onclick="playMovie('${m.title}','${m.trailer}')"><div class="badge">N</div><img src="${m.img}"><div class="overlay"><b>${m.title}</b><br><small>${m.actor}</small></div></div>`;}
function playMovie(t,id){document.getElementById('popup').innerHTML=`<div style="background:#111;width:100%;max-width:750px;border-radius:10px;padding:15px;"><h2>${t}</h2><iframe width="100%" height="400" src="https://www.youtube.com/embed/${id}?autoplay=1" frameborder="0" allowfullscreen></iframe><button style="width:100%;margin-top:10px;padding:12px;background:#e50914;color:#fff;border:none;border-radius:5px;" onclick="document.getElementById('popup').style.display='none'">Close</button></div>`;document.getElementById('popup').style.display='flex';}
render();
</script>
</body>
</html>
